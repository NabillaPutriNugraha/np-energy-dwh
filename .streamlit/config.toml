# Konfigurasi Streamlit untuk dashboard NP Energy Intelligence ("Luminous Eco-Intelligence").
# Dibaca dari folder tempat perintah "streamlit run" dijalankan (folder utama proyek).

[server]
# Hanya dapat diakses dari komputer ini (tidak dibuka ke jaringan). Ubah dengan sengaja jika kelak
# dashboard perlu dibuka dari perangkat lain.
address = "localhost"

[browser]
gatherUsageStats = false

[client]
# Menyembunyikan tombol Deploy dan menu pengembang agar tampilan presentasi bersih.
toolbarMode = "minimal"

[theme]
primaryColor = "#047857"
backgroundColor = "#F4F7F6"
secondaryBackgroundColor = "#EAF0EE"
textColor = "#0F2922"
font = "sans-serif"
borderColor = "#DCE5E2"
baseRadius = "0.75rem"
dataframeHeaderBackgroundColor = "#E6EFEA"
